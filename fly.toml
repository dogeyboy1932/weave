# Fly.io deploy config for SIIP.
# Fly hosts the API *and* the static UI from `ui/` on the same origin.
# Single database: Supabase (Postgres + pgvector). Set as a secret:
#   fly secrets set DATABASE_URL=...
# Knowledge-graph stats (Louvain + PageRank) are computed in-process by
# scoring/graph_compute.py and written back to Postgres — no Neo4j.

app = "siip-armchair-akhil"
primary_region = "ord"  # Chicago — close to UIUC

[build]
  dockerfile = "Dockerfile.api"

[env]
  POSTGRES_SSLMODE = "require"

[http_service]
  internal_port      = 8080
  force_https        = true
  # Keep one machine alive 24/7 so background ingest tasks (PDF upload =>
  # SciNCL embed => score) always have a host.
  # COST NOTE (2026): Fly's $5/mo hobby credit is gone. This always-on 2 GB
  # shared-cpu-1x now bills ~$4-6/mo. The free replacement is Hugging Face
  # Spaces — see deploy/HUGGINGFACE.md. This Fly config is kept as a fallback.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 10
    hard_limit = 20

# /health is fast; allow 60s grace for the SciNCL model to warm up on boot.
[[http_service.checks]]
  interval      = "30s"
  timeout       = "5s"
  grace_period  = "60s"
  method        = "GET"
  path          = "/health"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "2gb"            # SciNCL needs ~1.5 GB resident
